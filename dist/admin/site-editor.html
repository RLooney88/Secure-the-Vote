<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Site Editor Unavailable</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111827;
      color: #f9fafb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      max-width: 640px;
      width: 100%;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 45px rgba(0,0,0,.35);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
      color: #f6bf58;
    }
    p {
      margin: 0 0 14px;
      line-height: 1.6;
      color: #e5e7eb;
    }
    a {
      color: #f6bf58;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Site Editor temporarily unavailable</h1>
    <p>The AI-powered Site Editor has been disabled for now.</p>
    <p>Please use the other admin tools, or come back later once it has been re-enabled.</p>
    <p><a href="/admin/">Return to the admin dashboard</a></p>
  </div>
</body>
</html>
