<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Requests</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f7f7f7;margin:0;padding:20px;color:#222}
    .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px}
    h1{margin:0;font-size:28px}.muted{color:#666;font-size:14px}
    .layout{display:grid;grid-template-columns:380px 1fr;gap:16px}
    .card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px}
    .request{padding:12px;border:1px solid #e3e3e3;border-radius:8px;margin-bottom:10px;cursor:pointer}
    .request.active{border-color:#003366;box-shadow:0 0 0 2px rgba(0,51,102,.1)}
    .badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;background:#eee}
    .row{display:flex;gap:10px}.row > *{flex:1}
    input,select,textarea,button{font:inherit} input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
    textarea{min-height:120px}
    button{padding:10px 14px;border:none;border-radius:8px;background:#003366;color:#fff;cursor:pointer} button.secondary{background:#666} button.ghost{background:#eee;color:#222}
    .detail pre{white-space:pre-wrap;background:#fafafa;border:1px solid #eee;padding:10px;border-radius:8px}
    .links a{display:block;margin:6px 0;color:#003366;text-decoration:none}
  </style>
</head>
<body>
  <div class="top"><div><h1>Edit Requests</h1><div class="muted">Nova site edit requests for Secure the Vote</div></div><button id="refreshBtn" class="ghost">Refresh</button></div>
  <div class="layout">
    <div>
      <div class="card" style="margin-bottom:16px">
        <h3 style="margin-top:0">New Request</h3>
        <div class="row"><div><label>Title</label><input id="title"></div><div><label>Page</label><input id="page" placeholder="/ or page name"></div></div>
        <div style="margin-top:10px"><label>Description</label><textarea id="description"></textarea></div>
        <div class="row" style="margin-top:10px"><div><label>Requester Email</label><input id="email" type="email"></div><div><label>Preview Approval Needed</label><select id="approval"><option value="true">Yes</option><option value="false">No</option></select></div></div>
        <div style="margin-top:12px"><button id="createBtn">Create Request</button></div>
      </div>
      <div class="card"><h3 style="margin-top:0">Requests</h3><div id="list"></div></div>
    </div>
    <div class="card detail"><h3 id="detailTitle" style="margin-top:0">Select a request</h3><div id="detail"></div></div>
  </div>
  <script src="/js/edit-requests-admin.js"></script>
</body>
</html>
